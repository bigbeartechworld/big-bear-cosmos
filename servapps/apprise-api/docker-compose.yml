cosmos-installer: null
services:
  app:
    image: linuxserver/apprise-api:2.0.1@sha256:110422ebb81151b6cfe1810ccb7529f353d9fa0fad7b9286fe59b67907a08368
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
minVersion: 0.14.0
