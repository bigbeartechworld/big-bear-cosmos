cosmos-installer: null
services:
  app:
    image: linuxserver/apprise-api:2.0.1@sha256:4530e389d1fb0048541060ad57adca2cf4f681059a3755ee47faa2bc525767ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
minVersion: 0.14.0
