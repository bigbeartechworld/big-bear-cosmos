cosmos-installer: null
services:
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:da5150c6c159046574fbec37737127693c57fd0490dfc27501365b3059a4e9fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 7396
        published: 7396
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
minVersion: 0.14.0
