cosmos-installer: null
services:
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:abfd81b80fde1d8f659c201bfaa2c21648e9dc7f42468a700c82e0215ba763ab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 7396
        published: 7396
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
minVersion: 0.14.0
