cosmos-installer: null
services:
  app:
    image: linuxserver/foldingathome:8.5.6@sha256:f24390034073903dbd7ec724eaef27abe464cd729164338701fe3a31927d2dbc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 7396
        published: 7396
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/foldingathome/config
        target: /config
minVersion: 0.14.0
