cosmos-installer: null
services:
  app:
    image: linuxserver/rustdesk:1.5.0@sha256:bb4c5161f1df20602c791a025c69a6dbb88231e4b3e33801f1771f04a6d06487
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
minVersion: 0.14.0
