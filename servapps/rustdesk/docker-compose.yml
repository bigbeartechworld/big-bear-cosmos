cosmos-installer: null
services:
  app:
    image: linuxserver/rustdesk:1.5.0@sha256:f14fa6dba1558579a8613d266e7e9ea0009b77c5d45e4010e96bbaa81c39bacf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
minVersion: 0.14.0
