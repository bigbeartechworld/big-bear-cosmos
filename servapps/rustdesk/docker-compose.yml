cosmos-installer: null
services:
  app:
    image: linuxserver/rustdesk:1.5.0@sha256:edaf38e89697031bfe1d65ffacdffacb8826dca780b1932f9264f8f289d303f5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
minVersion: 0.14.0
