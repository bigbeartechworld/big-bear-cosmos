cosmos-installer: null
services:
  app:
    image: linuxserver/rustdesk:1.4.9@sha256:4e4d01107dcb3256ddf34b68f4f946171fa154352b433b454f77b95815d97216
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
minVersion: 0.14.0
