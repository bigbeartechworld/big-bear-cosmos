cosmos-installer: null
services:
  app:
    image: linuxserver/rustdesk:1.5.0@sha256:f7fd6d7dfa2e92dc98153e70c881443d5ab963acc6ed1dd2571dcf7593f63dc3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
minVersion: 0.14.0
