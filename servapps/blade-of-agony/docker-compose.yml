cosmos-installer: null
services:
  app:
    image: linuxserver/blade-of-agony:3.1.20261022@sha256:5fbf2a71441ce3ced9d2a1f02c8ede1b20dcd80e6157773146bde1a381675f40
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
minVersion: 0.14.0
