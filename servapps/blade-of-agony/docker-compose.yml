cosmos-installer: null
services:
  app:
    image: linuxserver/blade-of-agony:3.1.20261001@sha256:72d61ee18b609935c632df57cfbd420b62cc7ffc93c4ef4d83c81c841a0e5ebd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
minVersion: 0.14.0
