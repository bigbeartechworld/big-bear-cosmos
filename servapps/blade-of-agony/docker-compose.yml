cosmos-installer: null
services:
  app:
    image: linuxserver/blade-of-agony:3.1.20260924@sha256:72eedff1839fe51fd0a237dcefe292fab56ec91143069cbae68bbf8f10b5f0ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
minVersion: 0.14.0
