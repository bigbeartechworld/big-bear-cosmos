cosmos-installer: null
services:
  app:
    image: linuxserver/blade-of-agony:3.1.20260917@sha256:8926be7bc8b47c278a1436c5aaef79170be601adb8854d5e5156ea6de0607984
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
minVersion: 0.14.0
