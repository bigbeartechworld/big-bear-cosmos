cosmos-installer: null
services:
  app:
    image: linuxserver/kicad:10.0.3@sha256:041619c60f795effe4b96c23788edcbd63fb12fad4b8267e6f06372671b99641
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
minVersion: 0.14.0
