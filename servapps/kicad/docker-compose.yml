cosmos-installer: null
services:
  app:
    image: linuxserver/kicad:10.0.3@sha256:37416bcb454cf6ff4e54032b3d6332cbb0276f4a0f51da3f316148fc80e18b34
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
minVersion: 0.14.0
