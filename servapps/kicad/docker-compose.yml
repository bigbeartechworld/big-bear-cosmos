cosmos-installer: null
services:
  app:
    image: linuxserver/kicad:10.0.3@sha256:1b5466f6e4c24ab82abacc326fc5690d43c7b60efecdaaf40fb3af8a7baa0f0a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
minVersion: 0.14.0
