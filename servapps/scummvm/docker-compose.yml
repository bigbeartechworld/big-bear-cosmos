cosmos-installer: null
services:
  app:
    image: linuxserver/scummvm:2026.3.0@sha256:418ff00e4f4a331117783978e906b852c6df6bc458d5b5c919c31bad4f0a0fdc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
minVersion: 0.14.0
