cosmos-installer: null
services:
  app:
    image: linuxserver/scummvm:2026.4.0@sha256:74afd22ac0eea7978accb221420cbaf8f74d951c6f4efc20264da0491f5ca33d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
minVersion: 0.14.0
