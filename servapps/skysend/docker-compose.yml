cosmos-installer: null
services:
  skysend:
    image: skyfay/skysend:v3.0.1@sha256:aa38fb1213fb564037b728c6a8a5d619a3223dfd3006509b79058384fe76d6fa
    container_name: skysend
    restart: unless-stopped
    ports:
      - "23001:3000"
    volumes:
      - big-bear-skysend_data:/data
      - big-bear-skysend_uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
volumes:
  big-bear-skysend_data:
    name: big-bear-skysend_data
    driver: local
  big-bear-skysend_uploads:
    name: big-bear-skysend_uploads
    driver: local
minVersion: 0.14.0
