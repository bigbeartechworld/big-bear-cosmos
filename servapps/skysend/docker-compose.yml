cosmos-installer: null
services:
  skysend:
    image: skyfay/skysend:v3.1.0@sha256:12ec06476a2a55e8ae5f71f760d9a98546e1b60f99d93a9a2b9c977a62ae69c9
    container_name: skysend
    restart: unless-stopped
    ports:
      - "23001:3000"
    volumes:
      - big-bear-skysend_data:/data
      - big-bear-skysend_uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
volumes:
  big-bear-skysend_data:
    name: big-bear-skysend_data
    driver: local
  big-bear-skysend_uploads:
    name: big-bear-skysend_uploads
    driver: local
minVersion: 0.14.0
