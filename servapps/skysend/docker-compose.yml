cosmos-installer: null
services:
  skysend:
    image: skyfay/skysend:v3.2.0@sha256:f2d71b93ba103be1dfad3ee1fa6aa7bcde8a4dc199d9f13ac18d78c3c93b1a91
    container_name: skysend
    restart: unless-stopped
    ports:
      - "23001:3000"
    volumes:
      - big-bear-skysend_data:/data
      - big-bear-skysend_uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
volumes:
  big-bear-skysend_data:
    name: big-bear-skysend_data
    driver: local
  big-bear-skysend_uploads:
    name: big-bear-skysend_uploads
    driver: local
minVersion: 0.14.0
