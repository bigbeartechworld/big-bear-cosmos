cosmos-installer: null
services:
  app:
    image: linuxserver/bambustudio:02.08.04@sha256:81f70ad79762348d948a32ee50a593392a86b38ce3742d47936e5f43d4b82602
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
minVersion: 0.14.0
