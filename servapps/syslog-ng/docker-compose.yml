cosmos-installer: null
services:
  app:
    image: linuxserver/syslog-ng:4.11.0@sha256:3ac726bdd58cf979ab9e97ea37f6c56d7acf1d23586f5f3b29c8834b4f9bf547
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    ports:
      - target: 514
        published: 5514
        protocol: udp
      - target: 601
        published: 6601
        protocol: tcp
      - target: 6514
        published: 6514
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/syslog-ng/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
minVersion: 0.14.0
