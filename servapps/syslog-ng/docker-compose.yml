cosmos-installer: null
services:
  app:
    image: linuxserver/syslog-ng:4.11.0@sha256:124b191502b82118ab3078a1dc02609517dd8fd4cb64442e14ef86c9998286f0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    ports:
      - target: 514
        published: 5514
        protocol: udp
      - target: 601
        published: 6601
        protocol: tcp
      - target: 6514
        published: 6514
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/syslog-ng/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
minVersion: 0.14.0
