cosmos-installer: null
services:
  app:
    image: linuxserver/xemu:0.8.134@sha256:69728c7ad980bcef4469c04e7d310e1920403bb82cf6260c87f92cc833f87888
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
minVersion: 0.14.0
