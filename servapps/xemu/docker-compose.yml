cosmos-installer: null
services:
  app:
    image: linuxserver/xemu:0.8.134@sha256:eb5da0c57b28a9dddcc93e6cb6c7399c3c179d6943582d68926512abfaa1e14e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
minVersion: 0.14.0
