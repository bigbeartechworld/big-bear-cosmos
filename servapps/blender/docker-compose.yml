cosmos-installer: null
services:
  app:
    image: linuxserver/blender:5.2.3@sha256:e5f3ea336c1ca21bc6c37045c19b10d95f3cba27fc21b85221ea1beefcfd0328
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
minVersion: 0.14.0
