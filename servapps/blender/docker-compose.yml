cosmos-installer: null
services:
  app:
    image: linuxserver/blender:5.2.3@sha256:866069a7ea0600f80bad6f4050e9933cb3eb886b0a87ea1fa890fe5167ab0fd6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
minVersion: 0.14.0
