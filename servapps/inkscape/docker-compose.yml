cosmos-installer: null
services:
  app:
    image: linuxserver/inkscape:1.4.2@sha256:a33e7cbd9c8039b11f681d87bc07e9916e73c4bb245fa5df16fd227afdb8cb86
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
minVersion: 0.14.0
