cosmos-installer: null
services:
  app:
    image: linuxserver/limnoria:2026.5.8@sha256:72171932a19ce8adb7efb7b9f963a4418da745e1bd54533f64f39d93f9aefc18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
minVersion: 0.14.0
