cosmos-installer: null
services:
  app:
    image: linuxserver/projectsend:version-r2098@sha256:39bf1224ac7f8d9b728cd9009dae8c836bbda2ca33770e00544f3f765ec07722
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
minVersion: 0.14.0
