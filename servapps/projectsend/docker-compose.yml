cosmos-installer: null
services:
  app:
    image: linuxserver/projectsend:version-r2098@sha256:db700ac39f0a7b8e45d1a0a54ba31aa0bd8ad933cac2d3e74a81ddd423bdc0d3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
minVersion: 0.14.0
