cosmos-installer: null
services:
  app:
    image: linuxserver/babybuddy:2.11.0@sha256:69235a527e02788aeb367b2bd9bac33365690cf18e2183330999225bb0a7f97b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
minVersion: 0.14.0
