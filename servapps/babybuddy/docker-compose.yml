cosmos-installer: null
services:
  app:
    image: linuxserver/babybuddy:2.11.0@sha256:f62b64e174004fc6d9048099f78bfc9642bb59b37536e62505b0e15d2eede558
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
minVersion: 0.14.0
