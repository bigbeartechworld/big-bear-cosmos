cosmos-installer: null
services:
  app:
    image: linuxserver/babybuddy:2.11.0@sha256:bdb8f982509265944a5465d628be3453f8e161e11f54d0814c5b2c7a7918d710
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
minVersion: 0.14.0
