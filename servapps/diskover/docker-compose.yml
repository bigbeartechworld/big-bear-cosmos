cosmos-installer: null
services:
  app:
    image: linuxserver/diskover:2.3.5@sha256:6db9a9410ea4c1af9b62826f4cd80a496be48acf9bb355649d2deceecb0c342a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
minVersion: 0.14.0
