cosmos-installer: null
services:
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:5afbec6c331cda21ed0db3e625caa7f23527f28b062f2b6dce3a7750f6d2cf97
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
minVersion: 0.14.0
