cosmos-installer: null
services:
  app:
    image: linuxserver/rsnapshot:1.4.5@sha256:3662cff04ae2d7375be2468642f6612266cc44bdc6755fe533f50441581adb87
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
minVersion: 0.14.0
