cosmos-installer: null
services:
  app:
    image: linuxserver/libreoffice:25.8.7@sha256:bf14f2007f8c4b268e1105bcdefecabe6e0712e9ca33643eb288f3022e8b6fc6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
minVersion: 0.14.0
