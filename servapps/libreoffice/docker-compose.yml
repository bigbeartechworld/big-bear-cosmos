cosmos-installer: null
services:
  app:
    image: linuxserver/libreoffice:25.8.7@sha256:68f6fcab0306359cd6c6c641da415b3dd695470078908875d47573c88c517390
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
minVersion: 0.14.0
