cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:b373c7756c283886a5027060de9aef0a6b5251a300038a5e88944c628200cfd5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
