cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:60d52929d85e5f251eefce7eba161449a773ea35750ef3e1b5dc4b77e092257d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
