cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:cc7c9a87b40d05996fe026a5ff206df1f9c89cdde3f11dc838c44df29aea56b0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
