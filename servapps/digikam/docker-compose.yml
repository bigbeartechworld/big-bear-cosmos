cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:553255834b2fcb5fb8001d22adf3efb6058005d067fa1c950402f1e3f3d63ca0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
