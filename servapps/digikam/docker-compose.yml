cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:7a918da0cb2e97d0055008fc3caa6f4d4b9c81967cc33c43ea3dc9ac3563fe3b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
