cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:23f15c1d6877533648896787ec4de437618e6d516cefd93ef56dfb6eec9b7edc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
