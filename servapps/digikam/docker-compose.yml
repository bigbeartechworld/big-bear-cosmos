cosmos-installer: null
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:f500bfbb0e77b04beb6d4f70369954cb7e72f4961b5500b3380d0456b7a308c3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
minVersion: 0.14.0
