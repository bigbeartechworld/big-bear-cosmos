cosmos-installer: null
services:
  app:
    image: linuxserver/mstream:6.31.1@sha256:84bf0c8fd022b44b40b37bf7b71272c6950e753e6d7f0ac763ccab3b425351fb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
minVersion: 0.14.0
