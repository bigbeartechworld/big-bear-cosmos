cosmos-installer: null
services:
  app:
    image: linuxserver/mstream:6.31.1@sha256:1e371f1c96840fe80466f69ac3c925ec3b929dc34f9aa0277401ff6c7dbdb525
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
minVersion: 0.14.0
