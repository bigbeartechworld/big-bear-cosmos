cosmos-installer: null
services:
  app:
    image: linuxserver/eden:0.2.1@sha256:8b8610d6cfce8eaaf53622d17e15ad9846cc72e8aab125c50cccc0cabea01475
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
minVersion: 0.14.0
