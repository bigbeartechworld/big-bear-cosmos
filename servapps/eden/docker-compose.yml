cosmos-installer: null
services:
  app:
    image: linuxserver/eden:0.2.1@sha256:e027a282a2357980702e8ba72e865671f187b77da816ffe718b768aa7c289252
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
minVersion: 0.14.0
