cosmos-installer: null
services:
  app:
    image: linuxserver/eden:0.2.1@sha256:c149ae02c0cd47f10c940442912d64c719bc724fda9d59c91077e10869a8ad3e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
minVersion: 0.14.0
