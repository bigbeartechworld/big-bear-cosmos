cosmos-installer: null
# FILEBROWSER QUANTUM V2 - NEW DEPLOYMENT
# =======================================
# This is a SEPARATE app from 'filebrowser-quantum' (1.5.8-stable). They can coexist.
#
# WHY A NEW APP:
# - v2 replaces BoltDB (database.db) with SQLite (database.sqlite)
# - v2 refuses to start if database.db is still in the data directory
# - Config must be converted and migrateFrom set before the first v2 start
# - That migration is manual. An image tag change is not an upgrade
#
# FOR NEW INSTALLATIONS:
# - Deploy this app for a new FileBrowser Quantum 2 instance
# - The first start generates an admin password and prints it once in the logs
# - Web UI is on host port 8701 (8700 stays with the 1.5.8 app)
# - Database and config live in filebrowser-quantum-v2_data at /home/filebrowser/data
#
# FOR MIGRATION FROM 1.5.8:
# - Do NOT uninstall the existing 'filebrowser-quantum' app
# - Do NOT attach this app to the 1.5.8 data volume
# - Stop 1.5.8, back up database.db, rename it to database.db.old, convert config.yaml,
#   set server.database.migrateFrom, then start a v2 process against that copy
# - Migration: https://filebrowserquantum.com/en/docs/getting-started/v2/migration/

services:
  big-bear-filebrowser-quantum-v2:
    container_name: big-bear-filebrowser-quantum-v2
    image: gtstef/filebrowser:2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
    restart: unless-stopped
    environment:
      - TZ=UTC
      - FILEBROWSER_DATABASE_PATH=/home/filebrowser/data/database.sqlite
    volumes:
      - big-bear-filebrowser-quantum-v2_data:/home/filebrowser/data
      - big-bear-filebrowser-quantum-v2_srv:/srv
    ports:
      - "8701:80"
    networks:
      - big-bear-filebrowser-quantum-v2-network
networks:
  big-bear-filebrowser-quantum-v2-network:
    driver: bridge
volumes:
  big-bear-filebrowser-quantum-v2_data:
    name: big-bear-filebrowser-quantum-v2_data
    driver: local
  big-bear-filebrowser-quantum-v2_srv:
    name: big-bear-filebrowser-quantum-v2_srv
    driver: local
minVersion: 0.14.0
