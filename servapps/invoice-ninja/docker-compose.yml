cosmos-installer: null
# Configuration for invoice-ninja setup

# Name of the big-bear-invoice-ninja application
# Service definitions for the big-bear-invoice-ninja application
services:
  big-bear-invoice-ninja:
    image: invoiceninja/invoiceninja:5.13.43@sha256:8917b50fccd22d77ceda53b2b0dc7b7466a0d72e93fffa8aeeb868dcdb2c3915
    container_name: big-bear-invoice-ninja
    restart: unless-stopped
    user: 1500:1500
    environment:
      - IN_USER_EMAIL=admin@bigbeartechworld.com
      - IN_PASSWORD=ad178c4b-302f-44e6-937f-8c7808f23795
      - APP_URL=http://big-bear-invoice-ninja-web
      - APP_KEY=base64:4doW1cidLuSqm7Z/BhPu/bn5HGnCKyEcSSlbVPTYYRU=
      - APP_CIPHER=AES-256-CBC
      - DB_HOST=big-bear-invoice-ninja-db
      - DB_PORT=3306
      - DB_DATABASE=ninja
      - DB_USERNAME=ninja
      - DB_PASSWORD=ninja
      - REQUIRE_HTTPS=false
      - QUEUE_CONNECTION=database
      - IS_DOCKER=TRUE
    volumes:
      - big-bear-invoice-ninja_data_public:/var/www/app/public:rw,delegated
      - big-bear-invoice-ninja_data_storage:/var/www/app/storage:rw,delegated
      - big-bear-invoice-ninja_data_php_php.ini:/usr/local/etc/php/php.ini:ro
      - big-bear-invoice-ninja_data_php_php-cli.ini:/usr/local/etc/php/php-cli.ini:ro
    depends_on:
      - big-bear-invoice-ninja-db
    networks:
      - big-bear-invoice-ninja-network
  big-bear-invoice-ninja-web:
    # Name of the container
    container_name: big-bear-invoice-ninja-web
    # Image to be used for the container
    image: nginx:1.29@sha256:1881968aff6f7cdcc4b888c00a11f4ce241ad7ec957e0cb4a9e19e93a3ff87ea
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - big-bear-invoice-ninja_data_nginx_invoice-ninja.conf:/etc/nginx/conf.d/default.conf:ro
      - big-bear-invoice-ninja_data_public:/var/www/app/public:ro
    # Ports mapping between host and container
    ports:
      # Mapping port 8080 of the host to port 80 of the container
      - "8080:80"
    networks:
      - big-bear-invoice-ninja-network
  big-bear-invoice-ninja-db:
    image: mariadb:10.4@sha256:22edfe1c78349f8cae88bbb5c2873b7e6c515be767c91c691308ce57445806f3
    container_name: big-bear-invoice-ninja-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=ad178c4b-302f-44e6-937f-8c7808f23795
      - MARIADB_USER=ninja
      - MARIADB_PASSWORD=ninja
      - MARIADB_DATABASE=ninja
    volumes:
      - big-bear-invoice-ninja_data_mysql:/var/lib/mysql:rw,delegated
    networks:
      - big-bear-invoice-ninja-network
    depends_on:
      - big-bear-invoice-ninja-init
    # This command is required to set important mariadb defaults
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --wait_timeout=28800 --log-warnings=0
  big-bear-invoice-ninja-init:
    image: bash:5.3.20@sha256:61962062d969cb46dfc2bad061d36342406fa485f64f246aa7e95693ca07df1f
    container_name: big-bear-invoice-ninja-init
    volumes:
      - big-bear-invoice-ninja_data:/tmp/data
    networks:
      - big-bear-invoice-ninja-network
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    entrypoint: /bin/sh -c until(cat</tmp/data/.cosmos-run)2>/dev/null;do(IFS=,;s=$1;$s);done;IFS=,;z=$2;$z dummy sleep,1 exec,/tmp/data/.cosmos-run
    post_install:
      - |-
        mkdir -p /tmp/data
        cat > /tmp/data/.cosmos-run.tmp <<'BB_COSMOS_RUN'
        #!/bin/sh
        if [ ! -f /tmp/data/.init_complete ]; then echo 'Starting initialization process...' && if [ -f /tmp/data/init/init.sh ]; then echo 'Found init.sh, making it executable...' && chmod +x /tmp/data/init/init.sh && echo 'Executing init.sh...' && /tmp/data/init/init.sh && echo 'init.sh execution completed.' && touch /tmp/data/.init_complete && echo 'Initialization process finished.'; else echo 'Error: /tmp/data/init/init.sh not found!' && exit 1; fi; else echo 'Initialization already completed. Exiting.'; fi && exit 0
        BB_COSMOS_RUN
        chmod +x /tmp/data/.cosmos-run.tmp
        mv /tmp/data/.cosmos-run.tmp /tmp/data/.cosmos-run
networks:
  big-bear-invoice-ninja-network:
    driver: bridge
volumes:
  big-bear-invoice-ninja_data:
    name: big-bear-invoice-ninja_data
    driver: local
  big-bear-invoice-ninja_data_mysql:
    name: big-bear-invoice-ninja_data_mysql
    driver: local
  big-bear-invoice-ninja_data_nginx_invoice-ninja.conf:
    name: big-bear-invoice-ninja_data_nginx_invoice-ninja.conf
    driver: local
  big-bear-invoice-ninja_data_php_php-cli.ini:
    name: big-bear-invoice-ninja_data_php_php-cli.ini
    driver: local
  big-bear-invoice-ninja_data_php_php.ini:
    name: big-bear-invoice-ninja_data_php_php.ini
    driver: local
  big-bear-invoice-ninja_data_public:
    name: big-bear-invoice-ninja_data_public
    driver: local
  big-bear-invoice-ninja_data_storage:
    name: big-bear-invoice-ninja_data_storage
    driver: local
minVersion: 0.14.0
