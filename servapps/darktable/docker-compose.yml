cosmos-installer: null
services:
  app:
    image: linuxserver/darktable:25.6.1@sha256:197c931960bcc8786bc0523ae749654927d89e56e43a6b09cfbf6b3fb3c9bfcb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/darktable/config
        target: /config
minVersion: 0.14.0
