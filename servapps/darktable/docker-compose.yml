cosmos-installer: null
services:
  app:
    image: linuxserver/darktable:25.6.1@sha256:00ddd5b849bc499a73a5b40326a40eb444cb2d0ea17c86aff529779e7a5b5b70
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/darktable/config
        target: /config
minVersion: 0.14.0
