cosmos-installer: null
services:
  app:
    image: linuxserver/darktable:25.6.2@sha256:35535cd2b8787253981c0946bcde3d6126006ad2475c243982eacfdfecc19ec6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/darktable/config
        target: /config
minVersion: 0.14.0
