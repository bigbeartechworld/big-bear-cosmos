cosmos-installer: null
services:
  app:
    image: linuxserver/signal:8.32.0@sha256:58c849cc640538398e8681973b65a0c6a707fb6ccf624fbd3f9b361f0ca8e72c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
minVersion: 0.14.0
