cosmos-installer: null
services:
  app:
    image: linuxserver/signal:8.32.0@sha256:d40ff7467fe5981498305b9e3d6e9c46d7963ce27dbe7a4ade664578f066c853
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
minVersion: 0.14.0
