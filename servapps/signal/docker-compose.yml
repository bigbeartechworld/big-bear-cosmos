cosmos-installer: null
services:
  app:
    image: linuxserver/signal:8.31.0@sha256:8d6b41885d98a4752438de2bc42e229a0385809b3654e1d5a8c02065c9a7e9ae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
minVersion: 0.14.0
