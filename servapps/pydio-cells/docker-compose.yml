cosmos-installer: null
services:
  app:
    image: linuxserver/pydio-cells:5.1.0@sha256:39dd5302e3a20d55149741c724fc01953e59e876d6cada079867aac0719182f4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
minVersion: 0.14.0
