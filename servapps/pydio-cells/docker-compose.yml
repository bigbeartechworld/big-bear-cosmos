cosmos-installer: null
services:
  app:
    image: linuxserver/pydio-cells:5.1.0@sha256:231db913b99b3e1e277a31b8cb7c6738b31d1ebd03be2891bf5e517410377199
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
minVersion: 0.14.0
