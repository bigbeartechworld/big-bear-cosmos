cosmos-installer: null
services:
  app:
    image: linuxserver/rawtherapee:5.13.20261018@sha256:b6c861028327deed81c1ac5699991252aaa530c82da6b9f547ed7daee65f31cf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
minVersion: 0.14.0
