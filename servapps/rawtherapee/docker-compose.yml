cosmos-installer: null
services:
  app:
    image: linuxserver/rawtherapee:5.13.20261011@sha256:48febebce9f7bb82a7af5dbe96094edcf6128e9be76619e4d51d6ddf65fff70b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
minVersion: 0.14.0
