cosmos-installer: null
services:
  app:
    image: linuxserver/rawtherapee:5.13.20260927@sha256:3cbe79409125024131a8875d7ab1bb63810daa9b294cd7fbb1511a70b3aade8e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
minVersion: 0.14.0
