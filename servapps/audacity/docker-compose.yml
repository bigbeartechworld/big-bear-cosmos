cosmos-installer: null
services:
  app:
    image: linuxserver/audacity:4.0.1@sha256:f58f99d173d53e0f407ac8588b8d7dec13a8ac55ec345be1ae1d7013c16ad4cb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
minVersion: 0.14.0
