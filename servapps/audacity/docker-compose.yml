cosmos-installer: null
services:
  app:
    image: linuxserver/audacity:4.0.1@sha256:81a3afea2e00cb0aeb0a4a5f8aabb573775afefd1d5db69fc70116e9a1205c0f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
minVersion: 0.14.0
