cosmos-installer: null
services:
  app:
    image: linuxserver/audacity:4.0.1@sha256:4e06915fc8add87a34bac9b0c0235d8b9f75a081463972fed25df4a8b58c596e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
minVersion: 0.14.0
