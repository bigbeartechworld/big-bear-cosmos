cosmos-installer: null
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:e4744b8392782d57841b40ad502e3420e7938937cb5fb24e37d6bcf48f6a75f1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
minVersion: 0.14.0
