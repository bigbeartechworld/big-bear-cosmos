cosmos-installer: null
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:a5fc828ea0b51297a144e4ef4b7752641f1857df57024368b363a0ba01ae0f51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
minVersion: 0.14.0
