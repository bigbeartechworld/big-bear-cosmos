cosmos-installer: null
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:fe2bb6d7bbec92eb0c4ed0bda816d07f5ed8ce184127c0584338a2778038eb62
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
minVersion: 0.14.0
