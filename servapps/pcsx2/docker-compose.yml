cosmos-installer: null
services:
  app:
    image: linuxserver/pcsx2:2.8.2@sha256:2dd0400fe54b9ccaaf23d9c2b5bced2eb32c28856f7932b7808036ae49f9a489
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
minVersion: 0.14.0
