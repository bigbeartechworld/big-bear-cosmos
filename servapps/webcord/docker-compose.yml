cosmos-installer: null
services:
  app:
    image: linuxserver/webcord:4.14.0@sha256:56fd4fb3ed40ff914601424e63b81556fc169bec88607a24aded67017128cf2e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
minVersion: 0.14.0
