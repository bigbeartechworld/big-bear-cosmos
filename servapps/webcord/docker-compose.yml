cosmos-installer: null
services:
  app:
    image: linuxserver/webcord:4.14.0@sha256:bec02d38c1edef31921d2b42150529dbdb97d821075f9146ac680a211d12916f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
minVersion: 0.14.0
