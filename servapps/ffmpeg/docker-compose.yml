cosmos-installer: null
services:
  app:
    image: linuxserver/ffmpeg:9.0.2@sha256:6547359fac23a2747e606d380e10267b2923a38f68485d9cacefd039e74d3aa8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
minVersion: 0.14.0
