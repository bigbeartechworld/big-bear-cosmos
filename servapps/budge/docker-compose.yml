cosmos-installer: null
services:
  app:
    image: linuxserver/budge:0.0.9@sha256:efc0a9f474c380a1a141979bcd46c97c9e0435a94f60688d3b37bd85f4b732d3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
minVersion: 0.14.0
