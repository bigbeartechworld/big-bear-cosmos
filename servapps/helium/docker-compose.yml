cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.19.3@sha256:c05010766b1d5182f1b9b2e18ce3aa5a1b03cf3bdda7f043d641e5ada2b5e9ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
