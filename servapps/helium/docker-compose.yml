cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.18.2@sha256:6c0f462961684a624857d931949b844fe338b448d5265afd964929e4164fceca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
