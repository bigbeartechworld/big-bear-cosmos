cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.20.1@sha256:e1485c3408f3d41c0169eaf7f61762b238f466b64682fd5a9c071b477ccd6680
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
