cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.19.1@sha256:b54baf4d8102064e7b70a57c63276b77d047ddb8ed3303be38c27fcc21e31d0c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
