cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.18.1@sha256:4b6dc7b09c6ed8737993f98af689733709ed9fae9e9df5a1b99a686f443eddeb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
