cosmos-installer: null
services:
  app:
    image: linuxserver/helium:0.19.4@sha256:2298ac3333f7591051f37576deef4d1e6393cca1dbab032f143642fa4831aeca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
minVersion: 0.14.0
