cosmos-installer: null
services:
  app:
    image: linuxserver/winegui:4.5.1@sha256:11b54e3c42d7b9cef20f22ba7cea4dc9767edca36794515ba766c5395bef8e2d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
minVersion: 0.14.0
