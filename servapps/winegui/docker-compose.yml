cosmos-installer: null
services:
  app:
    image: linuxserver/winegui:4.5.1@sha256:7f052e9a577cd8bcd09b704ddbd909e85839d25507559f967ebba4c6c242b670
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
minVersion: 0.14.0
