cosmos-installer: null
services:
  app:
    image: linuxserver/winegui:4.5.1@sha256:e5fa5df6f9e566c7be2548ea9e547bcc5a41dc97fe7d31cdee6de107935a7ce8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
minVersion: 0.14.0
