cosmos-installer: null
services:
  app:
    image: linuxserver/winegui:4.4.0@sha256:b77b4a54c1847de07417ef92c4edd477ca8b027125da7082dac8d887f3ed0e1c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
minVersion: 0.14.0
