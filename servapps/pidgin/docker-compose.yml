cosmos-installer: null
services:
  app:
    image: linuxserver/pidgin:2.14.14@sha256:bc65e4095567bbfc9f4ca224cf4123065f7ba651a94d17602d9263bd5221dc76
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
minVersion: 0.14.0
