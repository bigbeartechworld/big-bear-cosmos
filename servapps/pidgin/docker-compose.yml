cosmos-installer: null
services:
  app:
    image: linuxserver/pidgin:2.14.14@sha256:ae7fff6df7a21a2704000af40fadee99e7980396b7871f27dba5c5af400662c0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
minVersion: 0.14.0
