cosmos-installer: null
services:
  app:
    image: linuxserver/pidgin:2.14.14@sha256:9ee6ed078cb63c60d2c2a7a5df485f7e3a04384e7f7e529c8ac5fd41cf7747c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
minVersion: 0.14.0
