cosmos-installer: null
services:
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:1e3620de7342a7368a9820a17a29edfe51bc6381efc2ec5091fe5deb429575b9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
minVersion: 0.14.0
