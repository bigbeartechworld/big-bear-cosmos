cosmos-installer: null
services:
  app:
    image: linuxserver/keepassxc:2.7.12@sha256:3e559db94c85c7a5566e4f470345e347bc05b563844b0fc9185c7ecd5d219123
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
minVersion: 0.14.0
