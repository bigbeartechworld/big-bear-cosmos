cosmos-installer: null
services:
  app:
    image: linuxserver/thunderbird:1140.17.0@sha256:580b7baa630b826f599609d82013a6a17c140084756276cd5ce639d5abcdd5cd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
minVersion: 0.14.0
