cosmos-installer: null
services:
  app:
    image: linuxserver/thunderbird:1140.17.0@sha256:fe03c975f7f3caad262438b7bd599ae3415c3d5cc07ef9751a3e7837e88d1192
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
minVersion: 0.14.0
