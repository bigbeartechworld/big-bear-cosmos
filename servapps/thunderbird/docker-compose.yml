cosmos-installer: null
services:
  app:
    image: linuxserver/thunderbird:1140.16.0@sha256:0a3ba3d267fe1790360db9168b6f1b8be4d319022034b1f6dd2e3c7aa88458ac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
minVersion: 0.14.0
