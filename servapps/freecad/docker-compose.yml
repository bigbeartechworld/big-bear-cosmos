cosmos-installer: null
services:
  app:
    image: linuxserver/freecad:1.1.4@sha256:e84add50316b74fdc4e89c7da967a6eb0114257b710080864e3ba2c5adfe72c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
minVersion: 0.14.0
