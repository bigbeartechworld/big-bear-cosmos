cosmos-installer: null
services:
  app:
    image: linuxserver/freecad:1.1.3@sha256:4f56100b99cfc8d967b0c15a34dd86f7a48b42cd318dfd40802fa40cf5a421ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
minVersion: 0.14.0
