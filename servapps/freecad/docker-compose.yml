cosmos-installer: null
services:
  app:
    image: linuxserver/freecad:1.1.4@sha256:a2687a6e8b6dec94832aa4c6e4134aa01ccc3ad80588fd2005c3faba03829bb3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
minVersion: 0.14.0
