cosmos-installer: null
services:
  app:
    image: linuxserver/freecad:1.1.4@sha256:8ada0e7264ef5df812f14162cbe45f109bc0e3e0d4e0b579825f05bf08718e1f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
minVersion: 0.14.0
