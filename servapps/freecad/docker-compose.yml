cosmos-installer: null
services:
  app:
    image: linuxserver/freecad:1.1.3@sha256:6989685024064a090e6d11e2663a95cff502eb743676dfcf21d950e196201a9d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
minVersion: 0.14.0
