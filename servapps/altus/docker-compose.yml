cosmos-installer: null
services:
  app:
    image: linuxserver/altus:5.8.1@sha256:0c9ef18b4f0182043204b6833855777409ec775294d76cea9540b941456b175c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
minVersion: 0.14.0
