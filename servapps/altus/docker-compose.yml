cosmos-installer: null
services:
  app:
    image: linuxserver/altus:5.8.1@sha256:d25458c497a012bf22733f99bb7d54c0a08575f2760ac1adf4a4b152c74c3b43
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
minVersion: 0.14.0
