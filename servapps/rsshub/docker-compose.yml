cosmos-installer: null
services:
  app:
    image: diygod/rsshub:2026-09-24
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
    ports:
      - target: 1200
        published: 1200
        protocol: tcp
    depends_on:
      - redis
      - browserless
  browserless:
    image: browserless/chrome:1-puppeteer-10.4.0
    restart: unless-stopped
    ulimits:
      core:
        hard: 0
        soft: 0
  redis:
    image: redis:8.8.3-alpine
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/rsshub/redis
        target: /data
minVersion: 0.14.0
