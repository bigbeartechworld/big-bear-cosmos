cosmos-installer: null
services:
  app:
    image: furier/websync:latest
    restart: unless-stopped
    working_dir: /src
    command: node server.js
    ports:
      - target: 3000
        published: 48109
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/websync/data
        target: /data
minVersion: 0.14.0
