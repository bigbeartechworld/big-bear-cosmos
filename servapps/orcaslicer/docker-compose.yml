cosmos-installer: null
services:
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:14f79f464648f80cdbfb392746b1dcc782d5d80ac40ee4557ab87426012568bd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
minVersion: 0.14.0
