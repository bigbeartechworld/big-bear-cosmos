cosmos-installer: null
services:
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:c9300331a3c75bb43c50e423a54283f306d1532fe973641aca0124def0b1e1cf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
minVersion: 0.14.0
