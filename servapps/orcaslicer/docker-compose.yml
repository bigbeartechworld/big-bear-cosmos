cosmos-installer: null
services:
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:bce31f2bfa6e7984855c8dabe1492e55bbe3e0095621892a37d04161e9194c72
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
minVersion: 0.14.0
