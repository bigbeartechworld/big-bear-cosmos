cosmos-installer: null
services:
  app:
    image: linuxserver/piper:2.5.2@sha256:b03c5e49b4ed899de5e4b7647d5a2395e6972bed0fe97215bc3ea3cbc0af94df
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PIPER_VOICE: ''
      LOCAL_ONLY: ''
      PIPER_LENGTH: ''
      PIPER_NOISE: ''
      PIPER_NOISEW: ''
      PIPER_SPEAKER: ''
      NO_STREAMING: ''
    ports:
      - target: 10200
        published: 10200
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/piper/config
        target: /config
minVersion: 0.14.0
