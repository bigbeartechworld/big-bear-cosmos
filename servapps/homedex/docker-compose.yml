cosmos-installer: null
services:
  homedex:
    image: ghcr.io/harshshah0203/homedex:0.2.5@sha256:c896084c063a358ed19932587d98f9a54d5520e5b2f9e1672ade279f8f0dcea0
    container_name: homedex
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "7377:7377"
    environment:
      HOMEDEX_DATA_DIR: /data
      HOMEDEX_LISTEN: ":7377"
      HOMEDEX_ADMIN_PASSWORD: CHANGE_ME
    volumes:
      - big-bear-homedex_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - discovery
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: homedex-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      VERSION: "1"
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - discovery
networks:
  app:
    driver: bridge
  discovery:
    driver: bridge
    internal: true
volumes:
  big-bear-homedex_data:
    name: big-bear-homedex_data
    driver: local
minVersion: 0.14.0
