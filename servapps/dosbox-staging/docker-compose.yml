cosmos-installer: null
services:
  app:
    image: linuxserver/dosbox-staging:0.83.0@sha256:e3846c5d036f8d26e3cf73137a0469f923561980e5a8c4f7f22c17306d1c9288
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
minVersion: 0.14.0
