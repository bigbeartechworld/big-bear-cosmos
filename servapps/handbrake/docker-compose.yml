cosmos-installer: null
services:
  app:
    image: linuxserver/handbrake:1.11.2@sha256:a80a03a272e76b8deeec071e5b0a3c582708da5603eee354ca2cb1e72b9e01b2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
minVersion: 0.14.0
