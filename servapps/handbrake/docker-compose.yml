cosmos-installer: null
services:
  app:
    image: linuxserver/handbrake:1.11.2@sha256:58c17f7f8b37d6cdb11ac269d927c953f0fb13cbc918372bceaa597a33d5e221
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
minVersion: 0.14.0
