cosmos-installer: null
services:
  app:
    image: linuxserver/filezilla:3.69.6@sha256:5fd56fe75c3bd14b111c42a7286e954381aac9b485b097aae2e0d1d19eb89e68
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
minVersion: 0.14.0
