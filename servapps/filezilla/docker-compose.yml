cosmos-installer: null
services:
  app:
    image: linuxserver/filezilla:3.69.6@sha256:a22863a26e29b566fa6bc883bc5cfda9074f6b4a0b42588045f1f40c57aa3e49
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
minVersion: 0.14.0
