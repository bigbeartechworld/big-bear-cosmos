cosmos-installer: null
services:
  app:
    image: linuxserver/filezilla:3.69.6@sha256:e9aee91a1a9905ad7299022a34c99ce17244ff5ec5c8950e5efaccad03b82ea3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
minVersion: 0.14.0
