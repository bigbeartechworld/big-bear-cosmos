cosmos-installer: null
services:
  coder:
    image: ghcr.io/coder/coder:v2.36.7@sha256:e8b2743529aea6a1e77bba764c8ec4a04dec65d27ca9caa0ec0b2dbcd3db0565
    container_name: coder
    restart: unless-stopped
    ports:
      - "7080:7080"
    environment:
      CODER_PG_CONNECTION_URL: postgresql://coder:918063d1-fb62-438f-8cbf-49e01f7364ff@database/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: http://localhost:7080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - big-bear-coder_home:/home/coder
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: coder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: 918063d1-fb62-438f-8cbf-49e01f7364ff
      POSTGRES_DB: coder
    volumes:
      - big-bear-coder_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  big-bear-coder_data:
    name: big-bear-coder_data
    driver: local
  big-bear-coder_home:
    name: big-bear-coder_home
    driver: local
minVersion: 0.14.0
