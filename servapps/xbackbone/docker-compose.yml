cosmos-installer: null
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:8e9f6abd2355d80d4faafccba05b9cbee4e2a522d8b462a0ec589232cf4fb210
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
minVersion: 0.14.0
