cosmos-installer: null
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:85d35185ba8bd0a4dfd15e9ed3f0730c3499ec00364174b45bc351ca3542a63d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
minVersion: 0.14.0
