cosmos-installer: null
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:52e39d9b1575ddc6522569804ee155ce1316c9f7868e0e2a69a48d9ceda68bdc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
minVersion: 0.14.0
