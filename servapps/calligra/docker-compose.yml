cosmos-installer: null
services:
  app:
    image: linuxserver/calligra:3.2.1@sha256:f959985c5f8480d6e03ce6264eebdff7bf64a825891fc96b80df0410b95d5f1f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
minVersion: 0.14.0
