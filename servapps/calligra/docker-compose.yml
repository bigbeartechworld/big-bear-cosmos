cosmos-installer: null
services:
  app:
    image: linuxserver/calligra:3.2.1@sha256:c1251088057743be3c8ff5c78b02c225db12e792b4bff81ab532143e989907ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
minVersion: 0.14.0
