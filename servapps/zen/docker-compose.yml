cosmos-installer: null
services:
  app:
    image: linuxserver/zen:1.23.1@sha256:7306e947e54169d4c7c9ba60322e5ed7cd43972acb948452eaa4765dc5d16fbb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
minVersion: 0.14.0
