cosmos-installer: null
services:
  app:
    image: linuxserver/zen:1.22.3@sha256:6e66d5e929a2f2b1d387eb4897489e600364e59fefb137a3c5fa13382b2afbcb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
minVersion: 0.14.0
