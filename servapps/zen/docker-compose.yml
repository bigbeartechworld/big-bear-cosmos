cosmos-installer: null
services:
  app:
    image: linuxserver/zen:1.23.4@sha256:254661ea126d98dcedbec1bb57cd0785ebdf3521b69a6b24df0952f60f8eb5a7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
minVersion: 0.14.0
