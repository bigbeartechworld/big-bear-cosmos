cosmos-installer: null
services:
  app:
    image: linuxserver/zen:1.23.3@sha256:1b439526abf01d08b3c1803fe78aae9bbd4c81f8af4e1ef447b7a365a3ba23e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
minVersion: 0.14.0
