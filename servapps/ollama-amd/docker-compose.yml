cosmos-installer: null
# Configuration for ollama-amd setup

# Name of the big-bear-ollama-amd application
# Service definitions for the big-bear-ollama-amd application
services:
  # Service name: big-bear-ollama-amd
  # The `big-bear-ollama-amd` service definition
  big-bear-ollama-amd:
    # Name of the container
    container_name: big-bear-ollama-amd
    # Image to be used for the container
    image: ollama/ollama:0.32.5-rocm@sha256:f5d30b387649cf60baa2678a88240eb5c9a5f43382a1c965b18c798deebee4d1
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PORT=11434
    # Volumes to be mounted to the container
    volumes:
      - big-bear-ollama-amd_.ollama:/root/.ollama
    # Ports mapping between host and container
    ports:
      # Mapping port 11434 of the host to port 11434 of the container
      - "11434:11434"
    devices:
      # Attach GPU
      - /dev/kfd
      - /dev/dri
volumes:
  big-bear-ollama-amd_.ollama:
    name: big-bear-ollama-amd_.ollama
    driver: local
minVersion: 0.14.0
