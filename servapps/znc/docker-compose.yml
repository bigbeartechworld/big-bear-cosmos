cosmos-installer: null
services:
  app:
    image: linuxserver/znc:1.10.3@sha256:f5187fab44a3c2cb4ece27030f4857a14d2b06a5ca739bd1d5973f2914dee6bf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6501
        published: 6501
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
minVersion: 0.14.0
