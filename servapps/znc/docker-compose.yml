cosmos-installer: null
services:
  app:
    image: linuxserver/znc:1.10.3@sha256:1ea1c89129a36d0a2a2beeec3bb896ff4b9be5f261e23c623aa8ee9974e1086b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6501
        published: 6501
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
minVersion: 0.14.0
