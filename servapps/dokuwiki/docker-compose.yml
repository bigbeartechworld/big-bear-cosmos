cosmos-installer: null
services:
  app:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:f39c992b29016fe10f888e3723481d470a3c19d409f65e1655645bbb223ad9a1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
minVersion: 0.14.0
