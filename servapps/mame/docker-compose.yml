cosmos-installer: null
services:
  app:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:347d5184b480017de07cb984100d34e924b364cf0b8b03121df7a5bd8894e4ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
minVersion: 0.14.0
