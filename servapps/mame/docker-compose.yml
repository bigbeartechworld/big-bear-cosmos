cosmos-installer: null
services:
  app:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:9f1016638565fcb920a1849344518b5d594ee55b19b9e9e2875d06606ec3dcc8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
minVersion: 0.14.0
