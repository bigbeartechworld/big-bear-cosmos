cosmos-installer: null
services:
  app:
    image: linuxserver/ldap-auth:3.4.8@sha256:516f35dccd01e8f03d4600f6e1102e3dc20666765336ce08a1b34afd1bf1ea5f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
minVersion: 0.14.0
