cosmos-installer: null
services:
  app:
    image: linuxserver/ldap-auth:3.4.8@sha256:34961466dc4474a8058fe22586b8f9a79bfb23b4417dec69f166bbaa463d11f2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
minVersion: 0.14.0
