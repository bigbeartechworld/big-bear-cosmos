cosmos-installer: null
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - big-bear-hermes_data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: zimaos
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
    deploy:
      resources:
        reservations:
          memory: 1G
volumes:
  big-bear-hermes_data:
    name: big-bear-hermes_data
    driver: local
minVersion: 0.14.0
