cosmos-installer: null
services:
  app:
    image: linuxserver/hishtory-server:0.335.20261023@sha256:ddd9cd6fc7ba9b2c9218ad351d4c50748e12ecb2abe2d5bba4921e164e63a503
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
minVersion: 0.14.0
