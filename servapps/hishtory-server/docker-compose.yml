cosmos-installer: null
services:
  app:
    image: linuxserver/hishtory-server:0.335.20261016@sha256:5cbf3c91579b4fe0fd1ae347e5855301972692d4de6a7231942315b76fe05617
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
minVersion: 0.14.0
