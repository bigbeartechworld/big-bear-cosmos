cosmos-installer: null
# Configuration for glance setup

# Name of the big-bear-glance application
# Service definitions for the big-bear-glance application
services:
  # Service name: app
  # The `app` service definition
  app:
    # Name of the container
    container_name: big-bear-glance
    # Image to be used for the container
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    # Container restart policy
    restart: unless-stopped
    # Glance exits unless /app/config/glance.yml exists, so a starter config is
    # seeded into the volume on first run. The guard keeps user edits intact.
    entrypoint: /bin/sh -c until(cat</app/config/.cosmos-run)2>/dev/null;do(IFS=,;s=$1;$s);done;IFS=,;z=$2;$z dummy sleep,1 exec,/app/config/.cosmos-run
    # Ports mapping between host and container
    ports:
      # Mapping port 8280 of the host to port 8080 of the container
      - "8280:8080"
    # Volumes to be mounted to the container
    volumes:
      # Dashboard configuration
      - big-bear-glance_config:/app/config
      # Docker socket for the docker-containers widget
      # (ro mount protects the socket file, not the Docker API behind it)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - big_bear_glance_network
    post_install:
      - |-
        mkdir -p /app/config
        cat > /app/config/.cosmos-run.tmp <<'BB_COSMOS_RUN'
        #!/bin/sh
        set -eu
        if [ ! -s /app/config/glance.yml ]; then
          mkdir -p /app/config
          cat > /app/config/glance.yml <<EOF
        pages:
          - name: Home
            columns:
              - size: small
                widgets:
                  - type: calendar
                    first-day-of-week: monday

                  - type: rss
                    limit: 10
                    collapse-after: 3
                    cache: 12h
                    feeds:
                      - url: https://selfh.st/rss/
                        title: selfh.st
                        limit: 4
                      - url: https://ciechanow.ski/atom.xml
                      - url: https://samwho.dev/rss.xml

              - size: full
                widgets:
                  - type: group
                    widgets:
                      - type: hacker-news
                      - type: lobsters

                  - type: docker-containers
                    hide-by-default: false

              - size: small
                widgets:
                  - type: weather
                    location: New York, United States
                    units: imperial
                    hour-format: 12h

                  - type: releases
                    cache: 1d
                    repositories:
                      - glanceapp/glance
        EOF
        fi
        exec /app/glance --config /app/config/glance.yml
        BB_COSMOS_RUN
        chmod +x /app/config/.cosmos-run.tmp
        mv /app/config/.cosmos-run.tmp /app/config/.cosmos-run
# Network configuration
networks:
  big_bear_glance_network:
    driver: bridge
volumes:
  big-bear-glance_config:
    name: big-bear-glance_config
    driver: local
minVersion: 0.14.0
