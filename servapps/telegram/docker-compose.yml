cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.3.2@sha256:e0acac08866ee19cfc46840083fd75c5aefd19559126182c9c27702dfe66d205
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
