cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.3.3@sha256:eb10a5ec544d99ec6f91f08770b3571b8b55f991549b4e056be952d5c129b85e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
