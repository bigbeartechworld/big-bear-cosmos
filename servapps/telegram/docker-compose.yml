cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.3.1@sha256:6066363938bcd953a63985fc787949f274a1a0a3e885ef7a44d526bd81892e91
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
