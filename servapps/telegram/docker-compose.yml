cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.2.9@sha256:95001d2147cddfe31b4fd74e24f5c0188c79178b541487f99596b9c7d2787748
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
