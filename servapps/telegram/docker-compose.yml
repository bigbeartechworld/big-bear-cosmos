cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.3.1@sha256:1f3105935e94cf226b58706d6dff51245c2019895c2ccb209cc30dc0b2855a32
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
