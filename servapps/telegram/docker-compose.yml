cosmos-installer: null
services:
  app:
    image: linuxserver/telegram:7.2.8@sha256:625bb3d20c1db2bc0a57e7e9d2ded64827756a47fd6b551c62503160045d6ab1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
minVersion: 0.14.0
