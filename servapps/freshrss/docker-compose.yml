cosmos-installer: null
services:
  app:
    image: linuxserver/freshrss:1.30.1@sha256:703a03364866dc3283d6b1d53c1eaf697de5a6c594bd4acb5367ec8631288808
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
minVersion: 0.14.0
