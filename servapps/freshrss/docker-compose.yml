cosmos-installer: null
services:
  app:
    image: linuxserver/freshrss:1.30.4@sha256:ad3ebe2553250edcecf74995c051b6426fc85b7ca18e744991cb1ca99c8d943d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
minVersion: 0.14.0
