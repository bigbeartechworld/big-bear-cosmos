cosmos-installer: null
services:
  app:
    image: linuxserver/lollypop:1.4.45@sha256:b99556134690ce17b9fd5d29228acbec9b319aecb945748b2e96b524a2e233de
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
minVersion: 0.14.0
