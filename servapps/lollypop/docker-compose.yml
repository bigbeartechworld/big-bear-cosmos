cosmos-installer: null
services:
  app:
    image: linuxserver/lollypop:1.4.45@sha256:aa525497087ade779351992433c6a6277ede4cdb20076ddbe42a077a63126bbf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
minVersion: 0.14.0
