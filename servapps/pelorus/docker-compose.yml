cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.3@sha256:f88bcea1363d012fe72e960a9359b2eacc8138feb6994530b24321a826dd0679
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
