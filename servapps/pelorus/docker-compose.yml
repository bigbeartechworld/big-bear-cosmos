cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.3@sha256:1237887b90c7f26ca22b4923a223b7342781ca242a249f048be4fd6fa9451616
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
