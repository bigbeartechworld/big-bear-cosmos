cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.3@sha256:4f08ca20c94f78f761e6a84d38534b55960289bf104c984d850f8a2b76569e74
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
