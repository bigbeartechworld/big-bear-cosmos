cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.4@sha256:cef9d489d310913c247ac2dba40f0d74134c9da0633d5521268d938912c70c54
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
