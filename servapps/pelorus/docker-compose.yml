cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.3@sha256:0e54b78e4ffc371a3f8d353e8eb5cb5104e63db3f65616ca27d7914282e7f7e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
