cosmos-installer: null
services:
  app:
    image: linuxserver/pelorus:0.2.4@sha256:b84198035870b61a5ef4b4a1e5e2babdd0d76910dc1951840a3e60d3668c0db7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
minVersion: 0.14.0
