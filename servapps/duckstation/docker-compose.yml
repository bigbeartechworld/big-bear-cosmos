cosmos-installer: null
services:
  app:
    image: linuxserver/duckstation:version-latest@sha256:b272b36098bd40328e2496a616f49e47360ee5550e46aa2ffd7cbc8d232d5c50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
minVersion: 0.14.0
