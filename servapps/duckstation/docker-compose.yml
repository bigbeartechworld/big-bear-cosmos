cosmos-installer: null
services:
  app:
    image: linuxserver/duckstation:version-latest@sha256:764fe1e10a888ee70bfa36cead6a4c4088479b99d57ab7fc7a246c4a74ef0bfa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
minVersion: 0.14.0
