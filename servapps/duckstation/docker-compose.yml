cosmos-installer: null
services:
  app:
    image: linuxserver/duckstation:version-latest@sha256:367a18e9e821d3bd46e480627b634556f29c98675c667454c2cac32d09817860
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
minVersion: 0.14.0
