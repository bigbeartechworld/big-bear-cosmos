cosmos-installer: null
services:
  app:
    image: linuxserver/cops:4.5.4@sha256:c2ce7e22a4315aeb06d19c796f9a2b6c5c73dabbd20c528d91a8b729b6ebb182
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
minVersion: 0.14.0
