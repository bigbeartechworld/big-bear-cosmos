cosmos-installer: null
services:
  app:
    image: linuxserver/cops:4.5.4@sha256:cd1ad4508f3d416a853a42179cae7fce4170b06563511b4d35748d229cda9163
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
minVersion: 0.14.0
