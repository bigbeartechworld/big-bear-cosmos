cosmos-installer: null
services:
  app:
    image: linuxserver/cops:4.5.4@sha256:c345c1bf03422bfc8bbcfeca77219f0358b76685cdd07d3fc949c74f84b24669
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
minVersion: 0.14.0
