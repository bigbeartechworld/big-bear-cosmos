cosmos-installer: null
services:
  app:
    image: linuxserver/cops:4.5.4@sha256:c82414569a11e32d02f5eb0708b0233e7a37031234e65a0464ebc842e6dd4e65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
minVersion: 0.14.0
