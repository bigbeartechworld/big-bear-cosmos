cosmos-installer: null
services:
  app:
    image: linuxserver/remmina:1.4.43@sha256:bf0f63faa3534ac55c1a5bcb76968f3c967e0ce573eec3e6b70955e08ae9b08e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
minVersion: 0.14.0
