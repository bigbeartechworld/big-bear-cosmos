cosmos-installer: null
services:
  app:
    image: linuxserver/remmina:1.4.43@sha256:b69842b38336b1cee9e9368fa781c883532ccf6664cd0b7ae186d8e5948c81e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
minVersion: 0.14.0
