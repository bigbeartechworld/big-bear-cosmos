cosmos-installer: null
services:
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:e56e620d3f3b3fce6feb13f97ac926317b800a3d4dba4b5f31177e98db0e0be2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
minVersion: 0.14.0
