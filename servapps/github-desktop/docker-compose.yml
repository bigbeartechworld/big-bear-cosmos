cosmos-installer: null
services:
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:2af67286e1c584956103af417d9593272f130de8bc6aa4e218efc0c4912bd86b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
minVersion: 0.14.0
