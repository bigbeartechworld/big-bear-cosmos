cosmos-installer: null
services:
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:82857210ca65f1413952e378c0389fbd5c0f99f4a93a7d6ad04d4844d3723658
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
minVersion: 0.14.0
