cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.12@sha256:b4730b04f2788a943c65577cc1685136ecb3888e1f4b8639be4e28dc37529e6f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
