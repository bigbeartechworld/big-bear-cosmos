cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.8@sha256:c8b7220ef719545001cbd1653fe3505d281ceebe01b2df0c6dba8ef7057314d6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
