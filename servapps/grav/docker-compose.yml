cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.10@sha256:314fc7b48f3698ad383f6b50528942d2a65b4c5b7fc7539f78e08b6f830009ee
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
