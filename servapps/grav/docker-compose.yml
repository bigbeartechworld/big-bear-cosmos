cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.11@sha256:b253f091561bbf2772eee6c96f703dd4596b95d589ef75b14724ccf4db72e7e6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
