cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.1.10@sha256:a2adc1b3aaeb5b01518d50e07a7851be4add1e2a2cb0eb289acc3ead4370fe02
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
