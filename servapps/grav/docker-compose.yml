cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.14@sha256:1cef266eacab55c83faea18e785474a5dd0d05c6061b7b7c17632aafb42b9695
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
