cosmos-installer: null
services:
  app:
    image: linuxserver/grav:2.2.9@sha256:4946e4f4f362efe45eafad32ceedde863229a3b84465e4818535f913763c880a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
minVersion: 0.14.0
