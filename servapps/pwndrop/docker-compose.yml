cosmos-installer: null
services:
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:d762bb7bac0aed541db69e5c10d2e7ed3cb35c16b944320aa89dbfbe211179af
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
minVersion: 0.14.0
