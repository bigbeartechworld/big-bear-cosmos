cosmos-installer: null
services:
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:03d921e0ef70389f22ab74b32ccbd30017bfc9a536bca52f4d7bf8b6a4a63d92
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
minVersion: 0.14.0
