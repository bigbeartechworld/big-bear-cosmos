cosmos-installer: null
services:
  app:
    image: linuxserver/pwndrop:1.0.1@sha256:b272271a51cf3e80279a00553ce3d5c854bdb970b7d79f89632adc357fe40236
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
minVersion: 0.14.0
