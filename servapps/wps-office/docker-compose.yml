cosmos-installer: null
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:8f0def94065abee8ef8aaf28744b341f7b599eb97fff9daf234ef6ff810aa6d2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
minVersion: 0.14.0
