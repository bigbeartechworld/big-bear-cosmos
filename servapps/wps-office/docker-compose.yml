cosmos-installer: null
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:8806d61b77e5da44b2e8e1505d1acd83475b2540ed57109a542c9e8e19f40691
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
minVersion: 0.14.0
