cosmos-installer: null
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:f75d78cf61505b4fc464bc0db227ecec0bedf47603f5fbbb54deed2848e74d65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
minVersion: 0.14.0
