cosmos-installer: null
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:72a7f80c2c45a118b2357c6c4264a738783623678697f7761d193dd45e430512
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
minVersion: 0.14.0
