cosmos-installer: null
services:
  app:
    image: linuxserver/wps-office:11.1.0@sha256:f2f3aac75806992d893e24d9e438a04317954641cafdb744fd737bae9d80819f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
minVersion: 0.14.0
