cosmos-installer: null
services:
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:66a85c75cb9709dde788b31ea2d64d48af052afb8cca28c5c4bd32bb5d845a59
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
minVersion: 0.14.0
