cosmos-installer: null
services:
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:99c17c22b65023358730ce4cfe25c2df71c82de6431ecd163962957cd6ca7a62
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
minVersion: 0.14.0
