cosmos-installer: null
services:
  app:
    image: linuxserver/vivaldi:8.2.4133@sha256:43cc10f0b35f1a442aeb74035ea9137f2fa6655c9aba93ef9c3d803a6109ed0f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
minVersion: 0.14.0
