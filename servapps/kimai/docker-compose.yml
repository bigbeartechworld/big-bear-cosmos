cosmos-installer: null
services:
  app:
    image: linuxserver/kimai:2.70.1@sha256:ee137d0cee2af0f4c9684945537b0ededbd7feb384d10570129079d8052d3179
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
minVersion: 0.14.0
