cosmos-installer: null
services:
  app:
    image: linuxserver/kimai:2.67.0@sha256:450d39ae0d98925c13ba7870193d6344cdbb761fc32aa134be4252f69d1b5714
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
minVersion: 0.14.0
