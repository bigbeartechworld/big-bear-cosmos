cosmos-installer: null
services:
  app:
    image: linuxserver/kimai:2.69.0@sha256:5f4e3934d75cf5aa41f2db53f7cee690b70962d42873b11dd960ae27a5968b42
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
minVersion: 0.14.0
