cosmos-installer: null
services:
  app:
    image: linuxserver/kimai:2.68.0@sha256:cd6aa5e2b69743e4b564c446731dbd521c55598527771e36212860cad48854e6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
minVersion: 0.14.0
