cosmos-installer: null
services:
  app:
    image: linuxserver/qemu-static:10.0.13@sha256:85959e8657d2e2ec534febf9c34fb09198557191828d7c68361094803ce23e37
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qemu-static/config
        target: /config
minVersion: 0.14.0
