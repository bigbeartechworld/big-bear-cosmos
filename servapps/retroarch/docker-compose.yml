cosmos-installer: null
services:
  app:
    image: linuxserver/retroarch:1.22.2@sha256:f148c679b390305b598b2175d9ec7654700ac148ba5773a363b84c5c792ae5e5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
minVersion: 0.14.0
