cosmos-installer: null
services:
  app:
    image: linuxserver/retroarch:1.22.2@sha256:855fea1198e3474243e31455c1b42c6a18f354ae4cd275e26063bfcf0cfa1089
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
minVersion: 0.14.0
