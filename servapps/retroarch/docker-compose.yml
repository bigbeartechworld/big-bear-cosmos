cosmos-installer: null
services:
  app:
    image: linuxserver/retroarch:1.22.2@sha256:d5b49482a1ba902c3448efc7c6961c574c10e37d1cdfc5273d1230b98dd1562c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
minVersion: 0.14.0
