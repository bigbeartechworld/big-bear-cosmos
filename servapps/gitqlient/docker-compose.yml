cosmos-installer: null
services:
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:427de021755feacea9a1fe5b40fd8ebb13b2ac6283dc86afbbc40b1fbb2407bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
minVersion: 0.14.0
