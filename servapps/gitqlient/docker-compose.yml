cosmos-installer: null
services:
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:1e4a60dae4ef0b6f20f083939c8a5f367a942bc74388126b09d0c27564486d49
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
minVersion: 0.14.0
