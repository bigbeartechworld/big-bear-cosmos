cosmos-installer: null
services:
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:2c69326c880942f02218715daf495978b88be8da985da42998747b439c96d644
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
minVersion: 0.14.0
