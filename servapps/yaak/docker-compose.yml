cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.9.0@sha256:fc83e838f56dfc15a5ed59192568d502c8bc48a7d81e6b2eea0ae489eed8e364
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
