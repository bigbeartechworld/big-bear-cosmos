cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.9.0@sha256:baedb709835196606a4c9669e432f8d6f92732b4d6433fda445dad7f9c60c337
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
