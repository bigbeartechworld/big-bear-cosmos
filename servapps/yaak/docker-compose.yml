cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.9.0@sha256:a572153e208c9cf1b1dc7024a7fc5a09fcfb1b98df1d548089c7f3c1bdcecc8d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
