cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.8.0@sha256:89af05e2a1558004a76e48d62377c021cb67acc7520950976d6b367ace8c411f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
