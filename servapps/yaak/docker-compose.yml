cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.9.0@sha256:0a5d99db725c0ba19974490d70b294348bd8ed5059f6564e94759bb65c6f21ca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
