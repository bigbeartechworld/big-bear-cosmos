cosmos-installer: null
services:
  app:
    image: linuxserver/yaak:2026.7.1@sha256:f4166075780b9815d2c4e7b55ede7c26f37580491abe3a93bba23163fc3b8e69
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
minVersion: 0.14.0
