cosmos-installer: null
services:
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:aa208fee2929652751febabc2bfcd651b6d7dbec77a5adde66d06d86a5efe082
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
minVersion: 0.14.0
