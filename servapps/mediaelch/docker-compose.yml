cosmos-installer: null
services:
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:62548eba071dfeaa2185bf035bd8d133ac2e68d76e9fed0a8e3fbe47a38262e3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
minVersion: 0.14.0
