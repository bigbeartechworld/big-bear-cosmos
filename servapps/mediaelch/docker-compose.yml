cosmos-installer: null
services:
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:fe36b6b5d089e7f40d938dbb204fb2aae74589329efd3dd985178744ae3495f2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
minVersion: 0.14.0
