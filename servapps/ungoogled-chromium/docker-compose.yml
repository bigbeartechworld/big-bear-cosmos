cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:156.0.8078@sha256:0aef995ae73843b0d70d876e3dc86505902558b715432b34037830b8e4c19c3b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
