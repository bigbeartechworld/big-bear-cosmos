cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:154.0.8037@sha256:59857b293c496b54f53918e3a00125fcbc523f3b16942dc8b7eea5954dc57b63
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
