cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:155.0.8059@sha256:fe12115faa4a65630a68789481b45f1a0daf1b0498f118580240b9048109ab4e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
