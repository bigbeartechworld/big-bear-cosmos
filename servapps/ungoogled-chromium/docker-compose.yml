cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:155.0.8059@sha256:6a8446ff5728b32212e412d46c0981ac10b276c4a97222fa12d07352654ada28
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
