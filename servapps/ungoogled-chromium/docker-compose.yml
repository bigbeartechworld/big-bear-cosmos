cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:154.0.8037@sha256:e347d80186a57a1c6d735e58d4df9ab382042537923bcae6aee073b283a2645a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
