cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:156.0.8078@sha256:c2153c4f828f1290064a6461b4525ad5c9368a1d817779377a052c3f3fe19cc7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
