cosmos-installer: null
services:
  app:
    image: linuxserver/ungoogled-chromium:154.0.8037@sha256:96a033f6967576b41bf3597176ac45417daf52992b6a9090009fd1dbc64210f5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
minVersion: 0.14.0
