cosmos-installer: null
services:
  app:
    image: linuxserver/raneto:0.18.1@sha256:67ad914a21192ddf9c3e0cce5fb0a5d65c272f00bf04ed2f59e73cb060b64767
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
minVersion: 0.14.0
