cosmos-installer: null
services:
  app:
    image: linuxserver/vlc:3.0.24@sha256:47fa90ac456cc9485e28ec7bccbedc56cedaab87853237461374c12fb91c588c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
minVersion: 0.14.0
