cosmos-installer: null
services:
  app:
    image: linuxserver/vlc:3.0.23@sha256:f7fa5bbd34c9283c96224c3571ce1cf4c4f2a7d9b98df531af2158fd2311f1bd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
minVersion: 0.14.0
