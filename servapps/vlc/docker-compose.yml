cosmos-installer: null
services:
  app:
    image: linuxserver/vlc:3.0.24@sha256:cb5a1ca8b2cc2e3b7062a9424cf00d0810d7fa615f64ff7ebcaa1821f2962b17
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
minVersion: 0.14.0
