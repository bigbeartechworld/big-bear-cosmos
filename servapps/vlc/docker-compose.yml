cosmos-installer: null
services:
  app:
    image: linuxserver/vlc:3.0.24@sha256:102c3ac0ac13a4a8252ab4c1d7b6d7faf52af0f193a54f5f7ddd8c131e798c83
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
minVersion: 0.14.0
