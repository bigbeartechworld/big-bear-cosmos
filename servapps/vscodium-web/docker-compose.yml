cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium-web:1.143.17183@sha256:a79ddea8dd91a9bfcc28c1fdac0a08c8e6fabcd29be23660cc95f5aaeab32809
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
minVersion: 0.14.0
