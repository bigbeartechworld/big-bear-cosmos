cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium-web:1.140.06880@sha256:5907b6ec2b6a306aec3a330b82ab54c36a97a550db1a7919b65e4ffabdb7fc58
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
minVersion: 0.14.0
