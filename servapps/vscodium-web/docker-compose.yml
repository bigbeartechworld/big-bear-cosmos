cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium-web:1.140.06880@sha256:e263889f8c040ac221144dd19e7ae9469e1b6f20c25acdca5694ef7eb6a9f514
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
minVersion: 0.14.0
