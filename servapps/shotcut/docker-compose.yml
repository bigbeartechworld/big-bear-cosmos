cosmos-installer: null
services:
  app:
    image: linuxserver/shotcut:26.9.27@sha256:d78247e48e8b4dab2c95c814bb4faaae38767018590d60f0d220326375ee1856
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
minVersion: 0.14.0
