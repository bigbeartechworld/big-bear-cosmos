cosmos-installer: null
services:
  app:
    image: linuxserver/shotcut:26.8.1@sha256:5bd6a0faccc7a1e1b1b1f09f13ae8c5646b0e426b5d76171b4f82558424847ce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
minVersion: 0.14.0
