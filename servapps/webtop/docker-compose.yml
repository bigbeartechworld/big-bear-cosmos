cosmos-installer: null
services:
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:21db23d80427859457e1abada23ed51b1d876c70bfb173ad602150e0b6deec94
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
minVersion: 0.14.0
