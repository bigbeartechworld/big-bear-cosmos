cosmos-installer: null
services:
  app:
    image: linuxserver/ferdium:7.2.3@sha256:2093ab9b3cb74d236df6b2a5d0bd3e261fa0e735785ca349c3dda24e21197502
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
minVersion: 0.14.0
