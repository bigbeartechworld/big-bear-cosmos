cosmos-installer: null
services:
  app:
    image: linuxserver/opera:139.0.6053@sha256:7d6452db13b431ce1527a10f7418599f9aa4f179c3449299d0a9c220d3da7847
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
