cosmos-installer: null
services:
  app:
    image: linuxserver/opera:138.0.6044@sha256:6afdd3f7e22f85578975af82cab4d230673d5c10e955a0ee8b003d2c01f46b55
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
