cosmos-installer: null
services:
  app:
    image: linuxserver/opera:137.0.6036@sha256:ce7ec16ceeffbf94ab3446ad4b036ec285216d599fd01ed37483c53b2527a3eb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
