cosmos-installer: null
services:
  app:
    image: linuxserver/opera:136.0.6008@sha256:aaadbb58c44d3893732b7a3d107d8473637fd3a2cb2771c83513c759bcbe9cfd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
