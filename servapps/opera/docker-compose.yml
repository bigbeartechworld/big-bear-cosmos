cosmos-installer: null
services:
  app:
    image: linuxserver/opera:137.0.6036@sha256:4e7baa93e28ec887a8f800db63b8ce66b44627b32d77114c4521d1e227f2836b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
