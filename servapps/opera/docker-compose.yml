cosmos-installer: null
services:
  app:
    image: linuxserver/opera:138.0.6044@sha256:d1b4784cac148e7f7c3a07d7a0df0fdbbaae5c9c7198d6c24b4ac74fdf2b43c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
