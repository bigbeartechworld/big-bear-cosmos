cosmos-installer: null
services:
  app:
    image: linuxserver/opera:136.0.6008@sha256:33f72d9ccc8a0e2c4fa59f1138761cb7b2c4f745dab5532073b2d9c6ad7f270f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
