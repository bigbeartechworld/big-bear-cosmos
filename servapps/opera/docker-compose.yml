cosmos-installer: null
services:
  app:
    image: linuxserver/opera:139.0.6053@sha256:ef50f6482655e20209ae98f9345a33ccc65ac5268f389e2f5fbeea7afb5b7d88
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
minVersion: 0.14.0
