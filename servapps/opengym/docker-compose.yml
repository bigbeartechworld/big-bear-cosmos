cosmos-installer: null
services:
  opengym:
    image: registry.gitlab.com/duartesantos8/opengym/web:1.3.9@sha256:eb97d4f78a9d495a41d0181440ae3394feab41e7200b7a4a36099cee36e80036
    container_name: opengym
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "20808:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    volumes:
      - big-bear-opengym_media_img:/usr/share/nginx/html/img:ro
      - big-bear-opengym_media_gif:/usr/share/nginx/html/gif:ro
  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:1.3.9@sha256:88b192dd743ed3746ddeeb973952bdf380c810d6b69337b8205d96d053d7962f
    container_name: opengym-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      RP_ID: localhost
      ORIGIN: http://localhost:20808
      RP_NAME: openGym
    volumes:
      - big-bear-opengym_data:/data
      - big-bear-opengym_coach_auth:/coach-auth
  media:
    image: alpine/git:2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    container_name: opengym-media
    restart: "no"
    entrypoint: /bin/sh -c
    command: |-
      set -e
      if [ -z "$$(ls -A /out/img 2>/dev/null)" ] || [ -z "$$(ls -A /out/gif 2>/dev/null)" ]; then
        rm -rf /tmp/ds
        git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
        cp /tmp/ds/images/*.jpg /out/img/
        cp /tmp/ds/videos/*.gif /out/gif/
      fi
    volumes:
      - big-bear-opengym_media_img:/out/img
      - big-bear-opengym_media_gif:/out/gif
volumes:
  big-bear-opengym_data:
    name: big-bear-opengym_data
    driver: local
  big-bear-opengym_coach_auth:
    name: big-bear-opengym_coach_auth
    driver: local
  big-bear-opengym_media_img:
    name: big-bear-opengym_media_img
    driver: local
  big-bear-opengym_media_gif:
    name: big-bear-opengym_media_gif
    driver: local
minVersion: 0.14.0
