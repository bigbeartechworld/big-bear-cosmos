cosmos-installer: null
services:
  app:
    image: linuxserver/yq:4.4.0@sha256:459ea899679213d9aa951398a5461d61f24dcce7358ef02398e506a0884854ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
minVersion: 0.14.0
