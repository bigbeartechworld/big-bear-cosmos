cosmos-installer: null
services:
  app:
    image: linuxserver/yq:4.4.2@sha256:a0e5f406011320cdeea8858a6c36cc56006651bdcf005d0d0ff2fdcd170ab872
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
minVersion: 0.14.0
