cosmos-installer: null
services:
  app:
    image: linuxserver/yq:4.4.5@sha256:30dca795585e8a0f10534c3ad15ff391a7b86258d3c4c24bf165ce262349849f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
minVersion: 0.14.0
