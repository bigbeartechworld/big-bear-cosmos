cosmos-installer: null
services:
  app:
    image: linuxserver/msedge:154.0.4258@sha256:74cbcae6d5fea76a2f3c4b105908b8b87cb1b6581fac1970306a5997f33b5120
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
minVersion: 0.14.0
