cosmos-installer: null
services:
  app:
    image: linuxserver/msedge:156.0.4314@sha256:8aa36fce1bd49d78d315f9a2581bda537b555afec381e73a285eeccba7049ed3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
minVersion: 0.14.0
