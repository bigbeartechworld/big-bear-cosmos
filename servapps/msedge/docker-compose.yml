cosmos-installer: null
services:
  app:
    image: linuxserver/msedge:156.0.4314@sha256:5b4c69679a25d544d41315a2fa4ba9485588aae6bfd0265e6d466b9b176b556c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
minVersion: 0.14.0
