cosmos-installer: null
services:
  app:
    image: linuxserver/msedge:156.0.4314@sha256:d00157a6c27389bc68f26b87c407d98df5361ab65771bea6469682c25c254e01
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
minVersion: 0.14.0
