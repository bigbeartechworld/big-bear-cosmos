cosmos-installer: null
services:
  app:
    image: samuel19982/podfetch:v5.2.3@sha256:a9705ffb906c020740b1e1aae4b38a0ea966d7190d47ee7956b4d573a48c16f9
    container_name: podfetch
    ports:
      - "8000:8000"
    volumes:
      - big-bear-podfetch_podcasts:/app/podcasts
      - big-bear-podfetch_db:/app/db
    environment:
      - DATABASE_URL=sqlite:///app/db/podcast.db
      - POLLING_INTERVAL=300
      - BASIC_AUTH=false
      - USERNAME=bigbear
      - PASSWORD=15c40698-3cd9-40ce-8039-e8d80fc1a030
      - GPODDER_INTEGRATION_ENABLED=false
    restart: unless-stopped
    networks:
      - podfetch-network
networks:
  podfetch-network:
    driver: bridge
volumes:
  big-bear-podfetch_podcasts:
    name: big-bear-podfetch_podcasts
    driver: local
  big-bear-podfetch_db:
    name: big-bear-podfetch_db
    driver: local
minVersion: 0.14.0
