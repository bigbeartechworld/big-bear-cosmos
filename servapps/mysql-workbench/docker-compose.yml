cosmos-installer: null
services:
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:7a9d8e4d6dd3907c6a2e6468617fbc3d1ba8a8847185a817369124de7ac01cde
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
minVersion: 0.14.0
