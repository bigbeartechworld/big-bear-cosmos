cosmos-installer: null
services:
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:05f55c6f18e9ce0ed399d55adbad87482b26f89f76f93d2288ab24ee26bbd95a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
minVersion: 0.14.0
