cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium:1.143.17183@sha256:78212cf7c9fffb53177129c37ea1f5173744a01ce5d59fa7a73e1d792913f7e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
minVersion: 0.14.0
