cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium:1.135.06055@sha256:53c93c2387fd2732bed7799ecb204ff2c50217e2912bc48af2c2202419f8e77e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
minVersion: 0.14.0
