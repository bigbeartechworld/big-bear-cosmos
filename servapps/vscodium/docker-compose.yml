cosmos-installer: null
services:
  app:
    image: linuxserver/vscodium:1.140.06880@sha256:634727885c3f1e8cb8bdf59fd4de97d263ebf843bede6851ea28e7a9bb2c96be
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
minVersion: 0.14.0
