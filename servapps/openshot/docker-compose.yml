cosmos-installer: null
services:
  app:
    image: linuxserver/openshot:4.0.1@sha256:35535fba64adfeeb2f9ccc5d2c37e296dc812f87e0c8cc3cb8346fccb3d2bf50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
minVersion: 0.14.0
