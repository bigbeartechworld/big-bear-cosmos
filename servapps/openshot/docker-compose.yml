cosmos-installer: null
services:
  app:
    image: linuxserver/openshot:4.0.1@sha256:d8f4b2fb7d547c6c44cd010290086d47d307b7707212c7c42a098de321c4df74
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
minVersion: 0.14.0
