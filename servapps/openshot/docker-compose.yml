cosmos-installer: null
services:
  app:
    image: linuxserver/openshot:4.0.1@sha256:5332b8911c60341a8db307dedfe7ab8b46cdf4dd17166c9f233693fc123c8ab7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
minVersion: 0.14.0
