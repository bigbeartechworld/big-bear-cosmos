cosmos-installer: null
services:
  app:
    image: linuxserver/cura:5.13.0@sha256:4b7f512f5e2f5460cc5897d5032640bb43c434220343e7089bc84cf8b7642311
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
minVersion: 0.14.0
