cosmos-installer: null
services:
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:b450a1f6bda7bc89396dde264d43dd144c48c5abf670d40f0e94d65b4e56dcfd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
minVersion: 0.14.0
