cosmos-installer: null
services:
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:1af282b7d2cf2bfe27a030c4f2ba6142109a3a93db4bdd466fbbbddc3e8ef7fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
minVersion: 0.14.0
