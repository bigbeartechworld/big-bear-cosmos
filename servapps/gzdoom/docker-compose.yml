cosmos-installer: null
services:
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:7a49da8af2239b6b2b50b68a3735646c84319ea3431ee37da5af191a384e9361
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
minVersion: 0.14.0
