cosmos-installer: null
services:
  app:
    image: linuxserver/gzdoom:4.14.2@sha256:9430ab9a5fe881498c3537c2a78ff403c3b0a8102f4a4d3af1985a97a92909c0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
minVersion: 0.14.0
