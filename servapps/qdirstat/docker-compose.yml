cosmos-installer: null
services:
  app:
    image: linuxserver/qdirstat:2.0.20261025@sha256:7909da908ad98d0f4fe807b28cee1cf07ddbc375980ce7907165e146f1d85415
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
minVersion: 0.14.0
