cosmos-installer: null
services:
  app:
    image: linuxserver/qdirstat:2.0.20261018@sha256:3c9c3f6b1ecb173d4cbcd25bf8b87cb9fe8c1d4e6a480554afe54f43158925db
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
minVersion: 0.14.0
