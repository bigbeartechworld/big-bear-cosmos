cosmos-installer: null
services:
  app:
    image: linuxserver/qdirstat:2.0.20261012@sha256:18b289a63ef1cf2ca088d6b887e894df627ed825a992851853edec92910f1078
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
minVersion: 0.14.0
