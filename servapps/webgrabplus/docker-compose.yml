cosmos-installer: null
services:
  app:
    image: linuxserver/webgrabplus:5.6.1@sha256:f7db50b6169fbf2064bc64f8112dcf0454c3820818c5f809dab6359da13e6f34
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
minVersion: 0.14.0
