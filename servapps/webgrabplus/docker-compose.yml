cosmos-installer: null
services:
  app:
    image: linuxserver/webgrabplus:5.6.1@sha256:d74b22735d82bc70609b1844040d57385568254a1e5c1328b14d14409284b226
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
minVersion: 0.14.0
