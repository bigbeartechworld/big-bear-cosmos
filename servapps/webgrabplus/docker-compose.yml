cosmos-installer: null
services:
  app:
    image: linuxserver/webgrabplus:5.6.1@sha256:4e4d9d00a3de6a4e7fcc461e7fc2c9d34a988ad77fa2c27a41b78c7af27f2deb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
minVersion: 0.14.0
