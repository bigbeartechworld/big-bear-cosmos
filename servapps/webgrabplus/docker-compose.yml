cosmos-installer: null
services:
  app:
    image: linuxserver/webgrabplus:5.6.1@sha256:c64881ad63a79ee1f8ce14541d59cbeae580c2c0bcae44e48e6a237e1906b2d2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
minVersion: 0.14.0
