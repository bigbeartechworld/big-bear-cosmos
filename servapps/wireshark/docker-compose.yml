cosmos-installer: null
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:9b334d73088a13b822fb81a4e6805106692efe2d23401a57cd190b50935f1899
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
minVersion: 0.14.0
