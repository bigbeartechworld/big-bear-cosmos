cosmos-installer: null
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:71f1ff10deb77110eedb651f1ec1ddd929793d371cf6550732a3f1c43ff86010
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
minVersion: 0.14.0
