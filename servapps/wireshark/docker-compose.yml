cosmos-installer: null
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:f685e7d714a1423d4bc55cb6761c1c384b1ca08227ba8d0e89030725c70f5e34
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
minVersion: 0.14.0
