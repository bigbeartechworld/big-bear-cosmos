cosmos-installer: null
services:
  app:
    image: linuxserver/wireshark:4.6.6@sha256:33647c4718f21746cedd9d791e4ba9e491706435524471c6894c96a4a1018fab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wireshark/config
        target: /config
minVersion: 0.14.0
