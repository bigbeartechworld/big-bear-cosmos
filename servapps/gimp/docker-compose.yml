cosmos-installer: null
services:
  app:
    image: linuxserver/gimp:version-284e0208@sha256:e2f5a8f3fadd795010c9201c136d5db02e542473eb3d21c53d913e7fb4d61c94
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gimp/config
        target: /config
minVersion: 0.14.0
