cosmos-installer: null
services:
  app:
    image: linuxserver/krita:5.3.4@sha256:965181ce18e3c9c1ace8fdd88c56cf1c381809ebc14a934b34d191ed09d123cd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
minVersion: 0.14.0
