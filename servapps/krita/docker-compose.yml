cosmos-installer: null
services:
  app:
    image: linuxserver/krita:5.3.4@sha256:5c185684d783c091e558c197c74df39c1898516afec1eb12620503f841deeb61
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
minVersion: 0.14.0
