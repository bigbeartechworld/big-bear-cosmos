cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.137.0@sha256:f7a5c7f1d8462219ad30f4d7a2ae821a305d298f53402d054af7ed03d718c69f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
