cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.143.1@sha256:87fbd7ffaca9302fc0688897c3aa65038792c74f80ab562f289bb003c24b3fee
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
