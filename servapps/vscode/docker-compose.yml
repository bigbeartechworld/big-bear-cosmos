cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.138.0@sha256:126a944773cdfc8d43a4a7e7438a89df817bfe426ac1981d1d5ccb963ca7ac47
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
