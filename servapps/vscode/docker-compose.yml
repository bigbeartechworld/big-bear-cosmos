cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.142.0@sha256:010fe3ed9e9a013508971a213b2e57f61ad500548c119224c880234609376193
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
