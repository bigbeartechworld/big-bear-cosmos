cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.139.1@sha256:36d514ed8b2ef676d8dbfbb90e523e121832ba791913ab02d9554151de3aa83d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
