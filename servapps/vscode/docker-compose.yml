cosmos-installer: null
services:
  app:
    image: linuxserver/vscode:1.141.1@sha256:cdfb552dcead6dff9d644108744d4278dd8755a497c1ed172eb06481d0b63d8d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
minVersion: 0.14.0
