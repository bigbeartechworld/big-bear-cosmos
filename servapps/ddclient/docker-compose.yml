cosmos-installer: null
services:
  app:
    image: linuxserver/ddclient:4.0.0@sha256:b1908f320d88bba7872301c048c8119188e5be508dab2dfa97171f98c1078603
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
minVersion: 0.14.0
