cosmos-installer: null
services:
  app:
    image: linuxserver/ddclient:4.0.0@sha256:025d446b276cf63be3c57c8cf54b6206319d1e5f2bbd7acd4def98bba7a32ee4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
minVersion: 0.14.0
