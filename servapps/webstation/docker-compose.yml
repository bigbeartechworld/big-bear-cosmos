cosmos-installer: null
services:
  app:
    image: linuxserver/webstation:0.14.2-romm@sha256:13d7c0fb09ff936e7f22120368d711e19012f869ba33fd73ceda65f13db44715
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
minVersion: 0.14.0
