cosmos-installer: null
services:
  app:
    image: linuxserver/webstation:0.14.2-romm@sha256:3a6ddb89de3dae9865e9f3484b3e1dc0462d8d531007b5d4e93e423a368b6a89
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
minVersion: 0.14.0
