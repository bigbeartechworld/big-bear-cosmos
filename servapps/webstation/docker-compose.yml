cosmos-installer: null
services:
  app:
    image: linuxserver/webstation:0.15.2-romm@sha256:14e57bca54910a6e8b0b808962497aeef0bb48e2a444a7a556a0667b40111081
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
minVersion: 0.14.0
