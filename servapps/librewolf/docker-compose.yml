cosmos-installer: null
services:
  app:
    image: linuxserver/librewolf:158.0.1@sha256:9503a95a4216b96b44483a458910de9b65708ae92bbeef0205f4d88ee1a9cdce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
minVersion: 0.14.0
