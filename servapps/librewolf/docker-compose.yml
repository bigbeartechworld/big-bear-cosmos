cosmos-installer: null
services:
  app:
    image: linuxserver/librewolf:158.0.1@sha256:209570e3839036c2d4d15558eac626f1f7ce521cc0141b6dba67f35d051e3210
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
minVersion: 0.14.0
