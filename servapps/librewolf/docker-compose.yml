cosmos-installer: null
services:
  app:
    image: linuxserver/librewolf:156.0.1@sha256:6adfdef0802c4ccbe9c36c4c2c3df234d6824cd8e6a9600edb23f845236ac296
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
minVersion: 0.14.0
