cosmos-installer: null
services:
  app:
    image: linuxserver/librewolf:158.0.1@sha256:78298efcbb552eb51e537758088f28c47c065f7fb2877fc0248b1e291937603c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
minVersion: 0.14.0
