cosmos-installer: null
services:
  app:
    image: linuxserver/librewolf:155.0.1@sha256:84205cecdcdd3c5db38206df705c32c663c64bfffc7b84efb457f98b4519b296
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
minVersion: 0.14.0
