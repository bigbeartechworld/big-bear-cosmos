cosmos-installer: null
services:
  app:
    image: linuxserver/luanti:5.18.0@sha256:337da07b956d401e3a4ec29fe88614b4be65b99f881f5a11bd95f569c00765ca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
minVersion: 0.14.0
