cosmos-installer: null
services:
  app:
    image: linuxserver/luanti:5.17.0@sha256:bfdd74733bbeed3c49a5b7cecfbd2b4b5fe3d1ff813aff9ddf31cc9ccef25aea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
minVersion: 0.14.0
