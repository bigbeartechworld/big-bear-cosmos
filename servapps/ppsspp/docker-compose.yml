cosmos-installer: null
services:
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:f3a12c830e6ef504f0e7dd1b8f47ea50c43430647e2946a7f02d028a5baf4985
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
minVersion: 0.14.0
