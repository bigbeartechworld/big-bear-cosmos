cosmos-installer: null
services:
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:5810e533a16da9a51c909c739672b0dc35bc9aef1773ebe408f85967226577ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
minVersion: 0.14.0
