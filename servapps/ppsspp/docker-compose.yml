cosmos-installer: null
services:
  app:
    image: linuxserver/ppsspp:1.20.4@sha256:1090608f46c96a8dfd02dd17f0471b3479139e619f30f336bd4e8112678da801
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
minVersion: 0.14.0
