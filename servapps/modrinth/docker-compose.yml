cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.22.0@sha256:6b6e632c4b18b4e72b9f0672c3ff3171de97832fa7b626eeba279ee5205cf295
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
