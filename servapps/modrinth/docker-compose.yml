cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.21.6@sha256:16ad845643755e2fbde08fc95336478aca085481a0232181b37d87374d32b985
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
