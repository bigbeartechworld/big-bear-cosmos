cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.21.10@sha256:5ecb9315ca34544ddfed76f079811bef5f7285d6cf86b7611c1bd31956d66843
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
