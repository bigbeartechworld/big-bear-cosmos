cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.22.0@sha256:bcdc1cf7319c190ab75c17b5d02612bb02fadd70b908356202bd58a5da0cdc3a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
