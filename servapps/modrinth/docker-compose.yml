cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.21.5@sha256:e58ca416ceae9ac31f2fab100ac3857fe9d2066fc07dcb8dc6af7240890e5ba0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
