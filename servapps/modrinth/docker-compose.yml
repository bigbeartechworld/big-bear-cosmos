cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.21.10@sha256:8d9e5b261f3973ded4264610db8c1bf582a66c8bd4994b9086e21793f576615f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
