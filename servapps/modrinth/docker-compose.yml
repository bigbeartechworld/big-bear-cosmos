cosmos-installer: null
services:
  app:
    image: linuxserver/modrinth:0.21.8@sha256:bdfdca5cd36c3b4736294a91063e03fbd4d7b1fa28c64932ab5ed4fc576f1b14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
minVersion: 0.14.0
