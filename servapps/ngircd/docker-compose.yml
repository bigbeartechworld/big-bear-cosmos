cosmos-installer: null
services:
  app:
    image: linuxserver/ngircd:version-27-r1@sha256:a45daaa107b7c5d6d9d39011758f73f97cc104f377694bd6cdad308718794fab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6667
        published: 6667
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
minVersion: 0.14.0
