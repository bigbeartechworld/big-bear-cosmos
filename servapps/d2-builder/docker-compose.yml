cosmos-installer: null
services:
  app:
    image: linuxserver/d2-builder:0.9.0@sha256:7f0d8cc53cb1ff88430a9dc30121f1350bafcd5c97f043b88d879ead04adbaf1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
minVersion: 0.14.0
