cosmos-installer: null
services:
  app:
    image: linuxserver/flycast:2.7.20261018@sha256:111a34293a74da4d21b81baa4cf95fa8c0ea9e2464aa93cfa61a60bdffdee5ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
minVersion: 0.14.0
