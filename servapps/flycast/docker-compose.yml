cosmos-installer: null
services:
  app:
    image: linuxserver/flycast:2.7.20261025@sha256:fd4d47dc0f9f448928e27dacfa233376e9cc0feb11c396d2805b556799633596
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
minVersion: 0.14.0
