cosmos-installer: null
services:
  app:
    image: linuxserver/flycast:2.7.20261004@sha256:e5d9e7b56f1d2ada07ad7e61405bd86c77e54fd908882c62f4a07b9f27ce5628
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
minVersion: 0.14.0
