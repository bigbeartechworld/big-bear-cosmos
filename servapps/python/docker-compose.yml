cosmos-installer: null
services:
  app:
    image: linuxserver/python:3.15.2@sha256:6c526db6ad81da8cea25cfeddd50051c2a9970a67d96fadc308c217a7e2d5d51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
minVersion: 0.14.0
