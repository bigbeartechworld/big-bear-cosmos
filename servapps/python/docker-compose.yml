cosmos-installer: null
services:
  app:
    image: linuxserver/python:3.15.1@sha256:f3f0f364d2a301441e6a8c304a1178cab0cabe975322044ba7c07314f9ed0c9e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
minVersion: 0.14.0
